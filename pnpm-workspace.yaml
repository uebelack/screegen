packages:
  - "packages/*"

# Vite+ versions, shared by every package. `vite` is aliased to
# @voidzero-dev/vite-plus-core and Vitest is pinned to the version Vite+ bundles.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
  "@vitest/coverage-v8": 5.1.0

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Types match the minimum supported Node (engines), also for transitive "*" ranges.
  "@types/node": "^24.19.2"

# The vite-plus-core alias doesn't semver-satisfy the `vite` peer ranges of
# Vitest and Vite plugins. Auto-installing those peers would pull a second,
# real Vite, so keep auto-install off and accept the alias for both peers.
autoInstallPeers: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
